name: "Setup Batron"
description: "Install batron CLI for AWS Batch deployments"
author: "takaishi"
branding:
  icon: "package"
  color: "orange"

inputs:
  version:
    description: "Version of batron to use"
    required: false
    default: "latest"
  github_token:
    description: "GitHub token for API requests"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Install batron
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      working-directory: /tmp
      run: |
        set -e

        # Detect architecture
        ARCH=$(uname -m)
        case $ARCH in
          x86_64)
            BATRON_ARCH="x86_64"
            ;;
          aarch64|arm64)
            BATRON_ARCH="arm64"
            ;;
          i386|i686)
            BATRON_ARCH="i386"
            ;;
          *)
            echo "Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

        # Detect OS (matches goreleaser's `title .Os`, e.g. Linux / Darwin)
        OS=$(uname -s)

        # Construct binary name
        BINARY_NAME="batron_${OS}_${BATRON_ARCH}"
        ARCHIVE_NAME="${BINARY_NAME}.tar.gz"

        # Determine release version
        if [ "${{ inputs.version }}" = "latest" ]; then
          VERSION=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/takaishi/batron/releases/latest | \
            jq -r '.tag_name')
        else
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v${VERSION}"
          fi
        fi
        BASE_URL="https://github.com/takaishi/batron/releases/download/${VERSION}"

        # Download, verify checksum and extract
        echo "Downloading batron from: ${BASE_URL}/${ARCHIVE_NAME}"
        curl -fsSL "${BASE_URL}/${ARCHIVE_NAME}" -o "${ARCHIVE_NAME}"
        curl -fsSL "${BASE_URL}/checksums.txt" -o checksums.txt
        grep " ${ARCHIVE_NAME}\$" checksums.txt | shasum -a 256 -c -
        tar -xzf "${ARCHIVE_NAME}" batron

        # Install to tool cache
        chmod +x batron
        sudo mv batron /usr/local/bin/batron

        # Verify installation
        batron --version
